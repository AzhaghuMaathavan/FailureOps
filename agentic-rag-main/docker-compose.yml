services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentic_rag_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_rag}
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agentic_rag}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - failureops

  rustfs-init:
    image: alpine:3.20
    user: root
    volumes:
      - rustfs-data:/data
    command: ["chown", "-R", "10001:10001", "/data"]
    networks:
      - failureops

  rustfs:
    image: rustfs/rustfs:latest
    container_name: failureops_rustfs
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-failureops}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-failureops_dev_secret_change_me}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs-data:/data
    command: ["/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health || curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - failureops

  rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: failureops_rag
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agentic_rag}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-failureops}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-failureops_dev_secret_change_me}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-failureops-documents}
      STORAGE_PROVIDER: rustfs
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - rag-pages:/app/storage/pages
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\""]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s
    restart: unless-stopped
    networks:
      - failureops

volumes:
  pgdata:
  rustfs-data:
  rag-pages:

networks:
  failureops:
    name: failureops
